<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Bạn - LUXURY Perfume Boutique</title>

    <link rel="stylesheet" href="css/giao-dien.css">
    <link rel="stylesheet" href="css/trang-don-hang.css">
</head>

<body>

    <!-- PHẦN ĐẦU TRANG (HEADER VỚI LOGO Ở CHÍNH GIỮA MENU) -->
    <header class="dau-trang">
        
        <!-- BÊN TRÁI: MENU ĐIỀU HƯỚNG -->
        <div class="header-left-nav">
            <nav class="thanh-dieu-huong">
                <a href="trang-chu.html">Trang Chủ</a>
                <a href="trang-san-pham.html">Sản Phẩm</a>
                <a href="trang-don-hang.html" class="active">Đơn Hàng</a>
            </nav>
        </div>

        <!-- Ở GIỮA: LOGO HÌNH ẢNH (logo-removebg-preview.png) -->
        <div class="header-center-logo">
            <a href="trang-chu.html" class="logo-center-wrap">
                <img src="logo-removebg-preview.png" alt="LUXURY Perfume Logo" class="logo-center-img">
            </a>
        </div>

        <!-- BÊN PHẢI: TÌM KIẾM & TÀI KHOẢN -->
        <div class="header-right-tools">
            <div class="thanh-tim-kiem-header">
                <div class="search-input-wrapper">
                    <span class="search-input-icon">🔍</span>
                    <input type="text" id="header-search-input" class="search-input-header" placeholder="Tìm kiếm nước hoa...">
                </div>
                <div id="header-search-dropdown" class="header-search-dropdown"></div>
            </div>

            <div class="tai-khoan">
                <!-- Tải tự động qua ung-dung.js theo vai trò người dùng -->
            </div>
        </div>

    </header>

    <!-- PHẦN QUẢN LÝ ĐƠN HÀNG (DÀNH CHO USER - READ ONLY) -->
    <main class="khu-vuc-don-hang">

        <!-- TIÊU ĐỀ -->
        <div class="tieu-de-don-hang">
            <p class="chu-nho">✦ LỊCH SỬ GIAO DỊCH VIP ✦</p>
            <h1>Đơn Đặt Hàng Của Bạn</h1>
            <p class="mo-ta-don-hang">
                Theo dõi hành trình vận chuyển, kiểm tra tình trạng đóng gói nguyên seal và thời gian giao nhận dự kiến của đơn hàng.
            </p>
        </div>

        <!-- 4 Ô THỐNG KÊ VIP -->
        <div class="thong-ke-don-hang">
            <div class="o-thong-ke">
                <p>Tổng đơn hàng</p>
                <strong id="user-total-orders">0</strong>
            </div>

            <div class="o-thong-ke">
                <p>Chờ xác nhận</p>
                <strong id="user-pending-orders">0</strong>
            </div>

            <div class="o-thong-ke">
                <p>Đang giao hỏa tốc</p>
                <strong id="user-shipping-orders">0</strong>
            </div>

            <div class="o-thong-ke">
                <p>Đã nhận thành công</p>
                <strong id="user-completed-orders">0</strong>
            </div>
        </div>

        <!-- BỘ LỌC TRẠNG THÁI -->
        <div class="bo-loc-don-hang">
            <button class="bo-loc active" data-status="tat-ca">Tất cả</button>
            <button class="bo-loc" data-status="cho-xac-nhan">Chờ xác nhận</button>
            <button class="bo-loc" data-status="dang-giao">Đang giao</button>
            <button class="bo-loc" data-status="hoan-thanh">Hoàn thành</button>
            <button class="bo-loc" data-status="da-huy">Đã hủy</button>
        </div>

        <!-- DANH SÁCH ĐƠN HÀNG TẢI ĐỘNG TỪ LOCALSTORAGE -->
        <div id="danh-sach-don-hang-container">
            <!-- Tự động render qua ung-dung.js (Chặn xem nếu chưa đăng nhập) -->
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="js/admin-config.js"></script>
    <script src="js/du-lieu.js"></script>
    <script src="js/ung-dung.js"></script>

</body>

</html>
