<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Bạn - Cửa Hàng Nước Hoa LUXURY</title>

    <link rel="stylesheet" href="css/giao-dien.css">
    <link rel="stylesheet" href="css/trang-don-hang.css">
</head>

<body>

    <!-- PHẦN ĐẦU TRANG -->
    <header class="dau-trang">
        <div class="logo">
            𝓛𝓤𝓧𝓤𝓡𝓨
        </div>

        <nav class="thanh-dieu-huong">
            <a href="trang-chu.html">𝕿𝖗𝖆𝖓𝖌 𝖈𝖍ủ</a>
            <a href="trang-san-pham.html">𝓢ả𝓷 𝓹𝓱ẩ𝓶</a>
            <a href="trang-don-hang.html" style="color: #6e62f1; font-weight: bold;">Đơ𝖓 𝖍à𝖓𝖌</a>
            <a href="trang-quan-tri.html">𝕼𝖚ả𝖓 𝖙𝖗ị</a>
        </nav>

        <div class="logo-giua">
            <img src="logo-removebg-preview.png" width="130px" alt="Luxury Logo">
        </div>

        <div class="tai-khoan">
            <a href="trang-quan-tri.html" style="color: #070707; text-decoration: none;">𝕿à𝖎 𝖐𝖍𝖔ả𝖓</a>
        </div>
    </header>

    <!-- ================================= -->
    <!-- PHẦN QUẢN LÝ ĐƠN HÀNG             -->
    <!-- ================================= -->
    <main class="khu-vuc-don-hang">

        <!-- TIÊU ĐỀ -->
        <div class="tieu-de-don-hang">
            <p class="chu-nho">Lịch sử đơn hàng</p>
            <h1>Quản Lý Đơn Hàng Của Bạn</h1>
            <p class="mo-ta-don-hang">
                Theo dõi hành trình, kiểm tra tình trạng và quản lý các đơn đặt nước hoa của bạn thời gian thực.
            </p>
        </div>

        <!-- 4 Ô THỐNG KÊ -->
        <div class="thong-ke-don-hang">
            <div class="o-thong-ke">
                <p>Tổng đơn hàng</p>
                <strong id="user-total-orders">0</strong>
            </div>

            <div class="o-thong-ke">
                <p>Chờ xác nhận</p>
                <strong id="user-pending-orders">0</strong>
            </div>

            <div class="o-thong-ke">
                <p>Đang giao</p>
                <strong id="user-shipping-orders">0</strong>
            </div>

            <div class="o-thong-ke">
                <p>Đã hoàn thành</p>
                <strong id="user-completed-orders">0</strong>
            </div>
        </div>

        <!-- BỘ LỌC TRẠNG THÁI -->
        <div class="bo-loc-don-hang">
            <button class="bo-loc active" data-status="tat-ca">Tất cả</button>
            <button class="bo-loc" data-status="cho-xac-nhan">Chờ xác nhận</button>
            <button class="bo-loc" data-status="dang-giao">Đang giao</button>
            <button class="bo-loc" data-status="hoan-thanh">Hoàn thành</button>
            <button class="bo-loc" data-status="da-huy">Đã hủy</button>
        </div>

        <!-- DANH SÁCH ĐƠN HÀNG TẢI ĐỘNG TỪ LOCALSTORAGE -->
        <div id="danh-sach-don-hang-container">
            <!-- Tự động render qua ung-dung.js -->
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="js/du-lieu.js"></script>
    <script src="js/ung-dung.js"></script>

</body>

</html>
