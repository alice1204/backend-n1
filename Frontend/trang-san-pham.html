<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm Nước Hoa - LUXURY Store</title>

    <link rel="stylesheet" href="css/giao-dien.css">
    <link rel="stylesheet" href="css/trang-san-pham.css">
</head>

<body>

    <!-- PHẦN ĐẦU TRANG -->
    <header class="dau-trang">
        <div class="logo">
            𝓛𝓤𝓧𝓤𝓡𝓨
        </div>

        <nav class="thanh-dieu-huong">
            <a href="trang-chu.html">𝕿𝖗𝖆𝖓𝖌 𝖈𝖍ủ</a>
            <a href="trang-san-pham.html" style="color: #6e62f1; font-weight: bold;">𝓢ả𝓷 𝓹𝓱ẩ𝓶</a>
            <a href="trang-don-hang.html">Đơ𝖓 𝖍à𝖓𝖌</a>
            <a href="trang-quan-tri.html">𝕼𝖚ả𝖓 𝖙𝖗ị</a>
        </nav>

        <div class="logo-giua">
            <img src="logo-removebg-preview.png" width="130px" alt="Luxury Logo">
        </div>

        <div class="tai-khoan">
            <a href="trang-quan-tri.html" style="color: #070707; text-decoration: none;">𝕿à𝖎 𝖐𝖍𝖔ả𝖓</a>
        </div>
    </header>

    <main class="khu-vuc-san-pham">

        <!-- BỘ LỌC BÊN TRÁI -->
        <aside class="bo-loc-san-pham">
            <h2>Bộ lọc sản phẩm</h2>

            <!-- TÌM KIẾM -->
            <div class="loc-tim-kiem">
                <h3>Tìm kiếm</h3>
                <input type="text" id="tu-khoa" placeholder="Nhập tên nước hoa...">
            </div>

            <!-- GIỚI TÍNH -->
            <div class="nhom-bo-loc">
                <h3>Giới tính</h3>
                <label>
                    <input type="checkbox" value="nam" name="gioi-tinh" onchange="locSanPham()"> Nam
                </label>
                <label>
                    <input type="checkbox" value="nu" name="gioi-tinh" onchange="locSanPham()"> Nữ
                </label>
                <label>
                    <input type="checkbox" value="unisex" name="gioi-tinh" onchange="locSanPham()"> Unisex
                </label>
            </div>

            <!-- THƯƠNG HIỆU -->
            <div class="nhom-bo-loc">
                <h3>Thương hiệu</h3>
                <label>
                    <input type="checkbox" value="dior" name="thuong-hieu" onchange="locSanPham()"> Dior
                </label>
                <label>
                    <input type="checkbox" value="chanel" name="thuong-hieu" onchange="locSanPham()"> Chanel
                </label>
                <label>
                    <input type="checkbox" value="gucci" name="thuong-hieu" onchange="locSanPham()"> Gucci
                </label>
                <label>
                    <input type="checkbox" value="versace" name="thuong-hieu" onchange="locSanPham()"> Versace
                </label>
            </div>

            <!-- KHOẢNG GIÁ -->
            <div class="nhom-bo-loc">
                <h3>Khoảng giá</h3>
                <label>
                    <input type="radio" name="khoang-gia" value="all" checked onchange="locSanPham()"> Tất cả mức giá
                </label>
                <label>
                    <input type="radio" name="khoang-gia" value="duoi-1" onchange="locSanPham()"> Dưới 1 triệu
                </label>
                <label>
                    <input type="radio" name="khoang-gia" value="1-2" onchange="locSanPham()"> 1 - 2 triệu
                </label>
                <label>
                    <input type="radio" name="khoang-gia" value="2-5" onchange="locSanPham()"> 2 - 5 triệu
                </label>
                <label>
                    <input type="radio" name="khoang-gia" value="tren-5" onchange="locSanPham()"> Trên 5 triệu
                </label>
            </div>

            <!-- NÚT TÌM KIẾM -->
            <button class="nut-tim-kiem" onclick="locSanPham()">
                LỌC SẢN PHẨM
            </button>
        </aside>

        <!-- DANH SÁCH SẢN PHẨM BÊN PHẢI -->
        <div class="khu-vuc-hien-thi-san-pham">
            <div class="tieu-de-san-pham">
                <h2>𝓢Ả𝓝 𝓟𝓗Ẩ𝓜 𝓝ƯỚ𝓒 𝓗𝓞𝓐</h2>
                <span id="so-luong-san-pham">Đang tải sản phẩm...</span>
            </div>

            <!-- KHUNG SẢN PHẨM ĐƯỢC TẢI TỪ LOCALSTORAGE -->
            <div id="danh-sach-san-pham" class="danh-sach-san-pham">
                <!-- Tải tự động qua ung-dung.js -->
            </div>
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="js/du-lieu.js"></script>
    <script src="js/ung-dung.js"></script>

</body>

</html>
